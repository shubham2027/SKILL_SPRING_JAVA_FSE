<div class="home-container">
  <h1>{{ portalName }}</h1>
  <p>Manage your courses, view your enrollments, and check your academic progress all in one place.</p>
  
  <div>
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p>{{ message }}</p>
  </div>

  <div>
    <!-- 
      [property] is one-way data binding (component -> DOM). 
      [(ngModel)] is two-way data binding (component <-> DOM). 
    -->
    <input [(ngModel)]="searchTerm" placeholder="Search courses...">
    <p>Searching for: {{ searchTerm }}</p>
  </div>
  
  <div class="stats-row">
    <div class="stat-card">
      <h3>Courses Available</h3>
      <p>{{ coursesAvailable }}</p>
    </div>
    <div class="stat-card">
      <h3>Enrolled</h3>
      <p>3</p>
    </div>
    <div class="stat-card">
      <h3>GPA</h3>
      <p>3.8</p>
    </div>
  </div>
</div>
